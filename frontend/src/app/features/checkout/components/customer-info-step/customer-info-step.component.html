<section aria-label="Datos del cliente">
  <h2>Tus datos</h2>
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate [attr.aria-busy]="false">
    <app-form-field
      #nameField="appFormField"
      label="Nombre completo"
      [required]="true"
      [error]="
        fullNameControl.invalid && fullNameControl.touched
          ? 'Ingresa tu nombre completo.'
          : null
      "
    >
      <input
        class="ui-input"
        [id]="nameField.inputId()"
        type="text"
        formControlName="fullName"
        autocomplete="name"
        placeholder="Ej. María Gómez"
        [attr.aria-invalid]="nameField.hasError()"
        [attr.aria-describedby]="nameField.describedBy()"
      />
    </app-form-field>

    <app-form-field
      #emailField="appFormField"
      label="Correo electrónico"
      [required]="true"
      [error]="
        emailControl.invalid && emailControl.touched ? 'Ingresa un correo electrónico válido.' : null
      "
    >
      <input
        class="ui-input"
        [id]="emailField.inputId()"
        type="email"
        formControlName="email"
        autocomplete="email"
        inputmode="email"
        placeholder="tu@correo.com"
        [attr.aria-invalid]="emailField.hasError()"
        [attr.aria-describedby]="emailField.describedBy()"
      />
    </app-form-field>

    <app-form-field
      #phoneField="appFormField"
      label="Teléfono"
      [required]="true"
      [error]="
        phoneControl.invalid && phoneControl.touched
          ? 'Ingresa un teléfono válido.'
          : null
      "
    >
      <input
        class="ui-input"
        [id]="phoneField.inputId()"
        type="tel"
        formControlName="phone"
        autocomplete="tel"
        inputmode="tel"
        placeholder="Ej. 987 654 321"
        [attr.aria-invalid]="phoneField.hasError()"
        [attr.aria-describedby]="phoneField.describedBy()"
      />
    </app-form-field>

    <div class="checkout-step-actions">
      <app-button type="button" variant="ghost" (clicked)="goBack()">Atrás</app-button>
      <app-button type="submit">Continuar</app-button>
    </div>
  </form>
</section>
