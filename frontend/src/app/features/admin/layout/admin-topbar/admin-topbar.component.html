<header class="admin-topbar">
  <button
    type="button"
    class="admin-topbar__toggle"
    aria-controls="admin-sidebar"
    [attr.aria-expanded]="sidebarOpen()"
    aria-label="Mostrar u ocultar la navegación de administración"
    (click)="toggleSidebar.emit()"
  >
    <span aria-hidden="true">☰</span>
  </button>

  <span class="admin-topbar__title">Panel de administración</span>

  <div class="admin-topbar__account">
    <span class="admin-topbar__user">
      {{ roleLabel() }}
      @if (currentEmail()) {
        <span class="admin-topbar__user-email">· {{ currentEmail() }}</span>
      }
    </span>
    <button type="button" class="admin-topbar__logout" (click)="logout()">Cerrar sesión</button>
  </div>
</header>
