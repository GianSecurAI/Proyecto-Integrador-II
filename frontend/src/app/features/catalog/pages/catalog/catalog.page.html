<main class="catalog-page">
  <app-catalog-toolbar
    [category]="filters().category"
    [query]="filters().query"
    (categoryChange)="onFiltersChange({ category: $event })"
    (queryChange)="onQueryChange($event)"
  />

  <div class="catalog-page__body">
    <button
      type="button"
      class="catalog-page__filters-toggle ui-btn ui-btn--secondary ui-btn--sm"
      (click)="toggleFiltersOpen()"
      [attr.aria-expanded]="filtersOpen()"
      aria-controls="catalog-filters-panel"
    >
      {{ filtersOpen() ? 'Ocultar filtros' : 'Mostrar filtros' }}
    </button>

    <div
      id="catalog-filters-panel"
      class="catalog-page__filters"
      [class.catalog-page__filters--open]="filtersOpen()"
    >
      <app-catalog-filters
        [filters]="filters()"
        (filtersChange)="onFiltersChange($event)"
        (resetFilters)="onResetFilters()"
      />
    </div>

    <div class="catalog-page__grid">
      <app-product-grid
        [status]="status()"
        [products]="products()"
        (retry)="load()"
      />
      @if (status() === 'loaded' && totalPages() > 1) {
        <nav class="catalog-page__pagination" aria-label="Paginación del catálogo">
          <button
            type="button"
            class="ui-btn ui-btn--secondary ui-btn--sm"
            [disabled]="page() === 0"
            (click)="goToPage(page() - 1)"
          >
            Anterior
          </button>
          <span aria-live="polite">Página {{ page() + 1 }} de {{ totalPages() }}</span>
          <button
            type="button"
            class="ui-btn ui-btn--secondary ui-btn--sm"
            [disabled]="page() + 1 >= totalPages()"
            (click)="goToPage(page() + 1)"
          >
            Siguiente
          </button>
        </nav>
      }
    </div>
  </div>
</main>
