<section class="final-cta">
  <h2 class="final-cta__heading">
    ¿Listo para crear algo <span class="final-cta__heading-accent">increíble</span>?
  </h2>
  <p class="final-cta__subheading">
    Únete a nuestros clientes satisfechos que confían en nosotros para sus regalos personalizados.
  </p>

  <div class="final-cta__actions">
    <a class="ui-btn ui-btn--primary ui-btn--lg" routerLink="/catalog"> Comience a comprar → </a>
    <a
      class="ui-btn ui-btn--whatsapp ui-btn--lg"
      [href]="whatsappHref()"
      target="_blank"
      rel="noopener noreferrer"
    >
      Conecta por WhatsApp
    </a>
  </div>
</section>
