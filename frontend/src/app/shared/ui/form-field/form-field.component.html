<div class="ui-field">
  <label class="ui-field__label" [for]="inputId()">
    {{ label() }}
    @if (required()) {
      <span class="ui-field__required" aria-hidden="true">*</span>
    }
  </label>

  <div class="ui-field__control">
    <ng-content></ng-content>
  </div>

  @if (hint() && !hasError()) {
    <p class="ui-field__hint" [id]="hintElementId()">{{ hint() }}</p>
  }

  @if (hasError()) {
    <p class="ui-field__error" [id]="errorElementId()" role="alert">{{ error() }}</p>
  }
</div>
