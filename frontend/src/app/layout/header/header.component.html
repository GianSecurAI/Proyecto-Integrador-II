<header class="app-header">
  <div class="app-header__bar">
    <a class="app-header__brand" routerLink="/">
      AR MAKERS <span class="app-header__brand-accent">3D</span>
    </a>

    <nav class="app-header__nav" aria-label="Principal">
      <a class="ui-btn ui-btn--ghost ui-btn--on-dark ui-btn--sm" routerLink="/catalog">
        Catálogo
      </a>

      <a
        class="ui-btn ui-btn--ghost ui-btn--on-dark ui-btn--sm app-header__cart-link"
        routerLink="/cart"
        [attr.aria-label]="'Carrito, ' + cartItemCount() + ' productos'"
      >
        Carrito
        @if (cartItemCount() > 0) {
          <span class="app-header__cart-badge" aria-hidden="true">{{ cartItemCount() }}</span>
        }
      </a>

      @if (isAuthenticated()) {
        @if (isStaff()) {
          <a class="ui-btn ui-btn--ghost ui-btn--on-dark ui-btn--sm" routerLink="/admin">
            Panel de administración
          </a>
        } @else {
          <a class="ui-btn ui-btn--ghost ui-btn--on-dark ui-btn--sm" routerLink="/account">
            Mi cuenta
          </a>
        }
        <button
          type="button"
          class="ui-btn ui-btn--ghost ui-btn--on-dark ui-btn--sm"
          (click)="logout()"
        >
          Cerrar sesión
        </button>
      } @else {
        <a class="ui-btn ui-btn--ghost ui-btn--on-dark ui-btn--sm" routerLink="/auth/request-code">
          Acceder
        </a>
      }
    </nav>
  </div>
</header>
