# Base configuration shared by every environment. No secret or environment-specific value is
# hardcoded here (Constitution Principle XIV/XVIII) — everything that differs per environment is
# read from an environment variable, with sane local-only defaults supplied in
# application-local.yml, never here.
spring:
  application:
    name: armakers3d-backend
  # No default active profile (security review H4): a deployment that forgets SPRING_PROFILES_ACTIVE must
  # NOT silently boot with the local-development defaults (open API docs, http cookies, DEBUG logs). Without a
  # profile the required DB_*/MAIL_* variables are missing and boot fails; local development selects
  # `local` (or `nodb`) explicitly: SPRING_PROFILES_ACTIVE=local or -Dspring-boot.run.profiles=local.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned exclusively by Flyway migrations (Constitution Principle X). "validate"
      # merely confirms the JPA mapping matches the migrated schema; it never generates DDL.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      # Payment proof upload (ADR-005): hard container limits, independent of the service-level checks.
      max-file-size: 5MB
      max-request-size: 6MB
      file-size-threshold: 0
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

# One-time-code policy (research.md #1 / spec.md Assumptions). Externalized so the Product Owner
# can tune the policy per environment without a code change, while the defaults match the values
# the spec documents as the testable acceptance criteria.
otp:
  expiry-minutes: ${OTP_EXPIRY_MINUTES:10}
  max-attempts: ${OTP_MAX_ATTEMPTS:5}
  max-requests-per-window: ${OTP_MAX_REQUESTS_PER_WINDOW:3}
  request-window-minutes: ${OTP_REQUEST_WINDOW_MINUTES:15}
  # Cumulative failed-verification cap per email across all its recent codes (security review M1).
  max-failed-attempts-per-email: ${OTP_MAX_FAILED_ATTEMPTS_PER_EMAIL:10}
  failed-attempts-window-minutes: ${OTP_FAILED_ATTEMPTS_WINDOW_MINUTES:60}
  # Per-client-IP call caps on the public OTP endpoints per request window (security review M3).
  ip-max-request-calls: ${OTP_IP_MAX_REQUEST_CALLS:10}
  ip-max-verify-calls: ${OTP_IP_MAX_VERIFY_CALLS:30}

# Per-account limit on authenticated mutating requests (BE-05, ADR-004 D4): fixed window, 429 RATE_LIMITED + Retry-After.
ratelimit:
  mutations-per-window: ${RATELIMIT_MUTATIONS_PER_WINDOW:60}
  window-minutes: ${RATELIMIT_WINDOW_MINUTES:10}

# First administrator bootstrap (DB-04): an email address, never a secret. Used only when no active administrator
# exists (see FirstAdministratorBootstrap). Leave empty once an administrator exists.
bootstrap:
  admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}

# Daily purge of old OTP codes and expired/revoked sessions (DB-06). Lima time; set PURGE_ENABLED=false to switch off.
purge:
  enabled: ${PURGE_ENABLED:true}
  cron: ${PURGE_CRON:0 30 3 * * *}

# Server-side session policy (research.md #3). The feature spec explicitly leaves session
# lifetime out of scope; 24h is a documented, reasonable default for this academic-scale system.
session:
  ttl-hours: ${SESSION_TTL_HOURS:24}
  cookie-name: ${SESSION_COOKIE_NAME:ARM3D_SESSION}
  # Secure=true requires HTTPS; disabled only for local http:// development via
  # application-local.yml, never in a deployed environment.
  cookie-secure: ${SESSION_COOKIE_SECURE:true}

# Authorization (Spring Security). API docs (/api-docs, /swagger-ui) are denied to everyone except
# ADMINISTRADOR unless explicitly opened; only the local and nodb profiles open them.
security:
  api-docs-public: ${API_DOCS_PUBLIC:false}

# Which adapter backs each feature port (backend-foundation.md section 11). Customer profiles are
# memory-only until the DB phase adds their migration; the prod profile refuses to start on memory.
app:
  # Public origin of the Angular SPA, used only for the tracking link in order emails. No default here:
  # every deployment must set FRONTEND_BASE_URL (local/nodb profiles supply a localhost value).
  frontend-base-url: ${FRONTEND_BASE_URL}
  # Payments (ADR-005): manual Yape/Plin verification. NO payment gateway, no provider, no secret: the customer uploads
  # a screenshot of the payment and the ADMIN verifies it; the standard order exists only after approval.
  payments:
    checkout-ttl-hours: ${PAYMENTS_CHECKOUT_TTL_HOURS:24}   # only AWAITING_PAYMENT_PROOF expires; once a proof exists the admin resolves it
    max-open-checkouts: ${PAYMENTS_MAX_OPEN_CHECKOUTS:3}
    max-proof-attempts: ${PAYMENTS_MAX_PROOF_ATTEMPTS:5}
    expiry-job-enabled: ${PAYMENTS_EXPIRY_JOB_ENABLED:true}
    proof:
      max-bytes: ${PAYMENTS_PROOF_MAX_BYTES:5242880}   # 5 MB per image (also enforced by the multipart limits below)
      storage-max-total-bytes: ${PAYMENTS_PROOF_STORAGE_MAX_TOTAL_BYTES:268435456}   # in-memory adapter only: 256 MB
      storage-max-bytes-per-checkout: ${PAYMENTS_PROOF_STORAGE_MAX_PER_CHECKOUT_BYTES:26214400}   # in-memory adapter only: 25 MB
  persistence:
    users: memory
    catalog: memory
    orders: memory
    incidents: memory
    payments: memory
    proofs: memory

mail:
  from: ${MAIL_FROM:no-reply@armakers3d.com}

# CORS origin for the Angular SPA, needed because the session cookie requires credentialed
# cross-origin requests when frontend and backend are not served from the same origin.
web:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:4200}

# Behind a TLS-terminating reverse proxy set FORWARD_HEADERS_STRATEGY=native so the container resolves the real
# client address (and https). The per-IP OTP throttle keys on it: with `none` behind a proxy every client would
# share the proxy address and one bucket (security review M3).
server:
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

# Only the health endpoint is exposed (liveness/readiness probe for the cloud host). Details are
# never shown, and the mail indicator is off so an SMTP outage does not mark the API as down.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
